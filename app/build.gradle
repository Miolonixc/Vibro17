plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// --- Semantic versioning -------------------------------------------------
// 0.0.x  – патчи / мелкие правки (исправление багов)
// 0.x.0  – минорные обновления (новые эффекты, экраны)
// x.0.0  – мажорные обновления (ломающие изменения, редизайн)
// versionCode вычисляется из versionName: MAJOR*10000 + MINOR*100 + PATCH
def versionNameValue = '0.8.2'
def versionParts = versionNameValue.tokenize('.').collect { it.toInteger() }
def versionCodeValue = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// --- Локальные секреты подписи (local.properties, gitignored) ------------
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.miolonixc.vibro17'
    compileSdk 34

    defaultConfig {
        applicationId 'com.miolonixc.vibro17'
        minSdk 21
        targetSdk 34
        versionCode versionCodeValue
        versionName versionNameValue
    }

    signingConfigs {
        create('release') {
            def ksPath = localProps['VIBRO17_KEYSTORE_FILE']
            def ksFile = ksPath ? rootProject.file(ksPath) : null
            if (ksFile != null && ksFile.exists()) {
                storeFile = ksFile
                storePassword = localProps['VIBRO17_KEYSTORE_PASSWORD']
                keyAlias = localProps['VIBRO17_KEY_ALIAS']
                keyPassword = localProps['VIBRO17_KEY_PASSWORD']
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def releaseConfig = signingConfigs.findByName('release')
            if (releaseConfig != null && releaseConfig.storeFile != null) {
                signingConfig = releaseConfig
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
}
