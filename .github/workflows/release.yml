name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Decode signing keystore
        run: |
          mkdir -p keys
          echo "${{ secrets.VIBRO17_KEYSTORE_BASE64 }}" | base64 -d > keys/vibro17-release.keystore

      - name: Write local.properties
        run: |
          cat >> local.properties <<EOF
          VIBRO17_KEYSTORE_FILE=keys/vibro17-release.keystore
          VIBRO17_KEYSTORE_PASSWORD=${{ secrets.VIBRO17_KEYSTORE_PASSWORD }}
          VIBRO17_KEY_ALIAS=${{ secrets.VIBRO17_KEY_ALIAS }}
          VIBRO17_KEY_PASSWORD=${{ secrets.VIBRO17_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
